<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendeley OAuth flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; padding: 36px 24px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: 100%; max-width: 960px; margin: 0 auto; }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font: 500 8px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin-bottom: 20px; font: 400 28px/1.15 var(--serif); letter-spacing: -.02em; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Authentication · Sequence</p>
    <h1>Mendeley OAuth flow</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mendeley-auth-title mendeley-auth-desc">
        <title id="mendeley-auth-title">Mendeley OAuth flow</title>
        <desc id="mendeley-auth-desc">Shows Desktop Editors and Document Server OAuth callbacks, token storage, and authenticated Mendeley API access.</desc>
        <defs>
          <marker id="mendeley-auth-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="mendeley-auth-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="mendeley-auth-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="mendeley-auth-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>
        <rect width="960" height="600" fill="#f5f5f5"/>

        <g>
          <rect x="156" y="156" width="744" height="256" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)"/>
          <rect x="156" y="156" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)"/>
          <text x="176" y="168" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing=".12em">ALT</text>
          <text x="208" y="168" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">[Desktop Editors]</text>
          <line x1="164" y1="312" x2="892" y2="312" stroke="rgba(45,49,66,0.20)" stroke-dasharray="4,3"/>
          <text x="168" y="328" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">[Document Server]</text>
        </g>
        <g fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="3,3">
          <line x1="156" y1="108" x2="156" y2="528"/>
          <line x1="320" y1="108" x2="320" y2="528"/>
          <line x1="505" y1="108" x2="505" y2="528"/>
          <line x1="684" y1="108" x2="684" y2="528"/>
          <line x1="852" y1="108" x2="852" y2="528"/>
        </g>

        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mendeley-auth-arrow)">
          <line x1="156" y1="136" x2="320" y2="136"/>
          <line x1="320" y1="196" x2="852" y2="196"/>
          <line x1="320" y1="220" x2="505" y2="220"/>
          <line x1="505" y1="244" x2="852" y2="244"/>
          <line x1="320" y1="268" x2="852" y2="268"/>
          <line x1="320" y1="340" x2="505" y2="340"/>
          <line x1="505" y1="368" x2="684" y2="368"/>
        </g>
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4">
          <line x1="852" y1="292" x2="320" y2="292" marker-end="url(#mendeley-auth-arrow-return)"/>
          <line x1="684" y1="396" x2="320" y2="396" marker-end="url(#mendeley-auth-arrow-return)"/>
        </g>
        <g fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#mendeley-auth-arrow-link)">
          <line x1="320" y1="472" x2="505" y2="472"/>
        </g>
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4">
          <line x1="505" y1="508" x2="320" y2="508" marker-end="url(#mendeley-auth-arrow-return)"/>
        </g>


        <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing=".06em" fill="#7a8399">
          <rect x="190" y="116" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="226" y="125">LOGIN</text>
          <rect x="550" y="176" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="586" y="185">CLEAR TOKEN</text>
          <rect x="370" y="200" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="209">AUTHORIZE</text>
          <rect x="630" y="224" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="678" y="233">REDIRECT TOKEN</text>
          <rect x="550" y="248" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="586" y="257">GET /TOKEN</text>
          <rect x="550" y="272" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="586" y="281">TOKEN FILE</text>
          <rect x="370" y="320" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="329">AUTHORIZE</text>
          <rect x="550" y="348" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="594" y="357">OAUTH.HTML</text>
          <rect x="460" y="388" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="502" y="397">TOKEN + STATE</text>
          <rect x="370" y="452" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="461">BEARER TOKEN</text>
          <rect x="370" y="488" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="497">DOCS / 401</text>
        </g>

        <g font-family="'Geist',sans-serif" text-anchor="middle" fill="#2d3142">
          <g><rect x="100" y="60" width="112" height="48" rx="6" fill="#ececec" stroke="#7a8399"/><text x="156" y="89" font-size="12" font-weight="600">User</text></g>
          <g><rect x="248" y="60" width="144" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="320" y="84" font-size="12" font-weight="600">ONLYOFFICE</text><text x="320" y="100" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">localStorage</text></g>
          <g><rect x="432" y="60" width="146" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="505" y="84" font-size="12" font-weight="600">Mendeley</text><text x="505" y="100" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">OAuth + API</text></g>
          <g><rect x="624" y="60" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="684" y="84" font-size="12" font-weight="600">oauth.html</text><text x="684" y="100" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">Document Server</text></g>
          <g><rect x="780" y="60" width="144" height="48" rx="6" fill="#ececec" stroke="#7a8399"/><text x="852" y="84" font-size="12" font-weight="600">Loopback helper</text><text x="852" y="100" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">127.0.0.1:8080</text></g>
        </g>

        <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(45,49,66,0.12)"/>
        <g font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">
          <text x="40" y="576" letter-spacing=".14em">KEY</text>
          <line x1="100" y1="573" x2="140" y2="573" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mendeley-auth-arrow)"/>
          <text x="150" y="576">REQUEST</text>
          <line x1="290" y1="573" x2="250" y2="573" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mendeley-auth-arrow-return)"/>
          <text x="300" y="576">RETURN</text>
          <line x1="400" y1="573" x2="440" y2="573" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#mendeley-auth-arrow-link)"/>
          <text x="450" y="576">API REQUEST</text>
          <line x1="620" y1="573" x2="580" y2="573" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mendeley-auth-arrow-return)"/>
          <text x="630" y="576">401 RETURNS TO LOGIN</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
